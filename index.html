<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현장기록장">
<title>현장 기록장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1f5fbf">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--sub:#667085;--line:#d9dde3;--pri:#1f5fbf;--pri-tx:#fff;--warn:#b54708;--warn-bg:#fff4e5;--ok:#1a7f4b;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1e2328;--tx:#eceff3;--sub:#9aa4b2;--line:#323a43;--pri:#5b9bff;--pri-tx:#0b1320;--warn:#ffb867;--warn-bg:#2a2216;--ok:#4cc38a;--bad:#ff7b6b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:14px 14px 110px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
label:first-child{margin-top:0}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.seg button.on.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on.diff{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn{display:inline-block;padding:13px 18px;border:0;border-radius:12px;background:var(--pri);color:var(--pri-tx);font-weight:700;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 2px;border:0;background:none;font-size:12px;color:var(--sub)}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:700}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.item{cursor:pointer}
.item .t{font-weight:700}
.item .m{font-size:14px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-right:4px}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.ph img{display:block;width:100%;height:110px;object-fit:cover}
.ph input,.ph select{border:0;border-top:1px solid var(--line);border-radius:0;padding:8px;font-size:14px;width:100%;background:transparent}
.ph button{width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--bad);padding:6px;font-size:13px}
.rrow{display:grid;grid-template-columns:1fr 88px 88px 40px;gap:6px;margin-bottom:6px}
.rrow input,.rrow select{padding:10px 8px}
.rrow button{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--bad)}
.rhead{display:grid;grid-template-columns:1fr 88px 88px 40px;gap:6px;font-size:12px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--pri)}
.pb{height:12px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.pb i{display:block;height:100%;background:var(--pri)}
.pb u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.big{font-size:38px;font-weight:800;line-height:1.1}
.kv{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-top:6px;gap:8px;flex-wrap:wrap}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:16px;color:var(--tx)}
.chk input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:.95}
small.hint{color:var(--sub);font-size:13px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
header button{border:1px solid var(--line);background:var(--bg);border-radius:12px;width:48px;height:44px;font-size:22px}
header b{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:18px;font-weight:700;cursor:pointer}
.tile span{font-size:34px}
.sumrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sumrow .card{margin-bottom:0}
.dn{display:flex;align-items:center;gap:14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dgrid .card{margin-bottom:0}
.vw{position:fixed;inset:0;z-index:20;background:#2b2f36;display:flex;flex-direction:column;color:#fff;touch-action:none}
.vbar,.vtools{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1b1f24;flex-wrap:wrap}
.vbar{padding-top:calc(6px + env(safe-area-inset-top))}
.vtools{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.vt{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{min-width:44px;min-height:44px;border:1px solid #444b55;border-radius:10px;background:#2b2f36;color:#fff;font-size:18px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 6px}
.vb small{font-size:10px;color:#aab}
.vb.on{background:#1f5fbf;border-color:#5b9bff}
.vc::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid #fff}
.vsel{width:auto;min-height:44px;border-radius:10px;background:#2b2f36;color:#fff;border:1px solid #444b55;padding:0 8px;font-size:15px}
.vpg{min-width:56px;text-align:center}
.vsep{width:1px;height:30px;background:#444b55;margin:0 2px}
.vstage{flex:1;position:relative;overflow:hidden;touch-action:none}
#vwrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#vwrap canvas{position:absolute;left:0;top:0;display:block}
#vpdf{box-shadow:0 2px 12px rgba(0,0,0,.5);background:#fff}
.vtoc{position:absolute;right:8px;top:8px;bottom:8px;width:min(360px,85%);overflow:auto;background:#1b1f24ee;border:1px solid #444b55;border-radius:12px;padding:10px;z-index:3}
.vtoc-i{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:44px;text-align:left;background:none;border:0;border-bottom:1px solid #333a44;color:#fff;font-size:15px;padding:6px 4px;white-space:pre}
.vtoc-i small{color:#aab}
mark{background:#ffe066;color:#000;border-radius:3px}
</style>
</head>
<body>
<header><button id="hd-home" aria-label="홈">🏠</button><b id="hd-title">홈</b></header>
<main id="app"></main>
<div id="toast"></div>

<script>
'use strict';
/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const DOW = ['일','월','화','수','목','금','토'];
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${m}/${d}(${DOW[new Date(y, m - 1, d).getDay()]})`; };
const pct = x => (x * 100).toFixed(1) + '%';
const num = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
const fmtN = v => { const n = Math.round(num(v) * 100) / 100; return n.toLocaleString('ko-KR'); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------- 저장소 (IndexedDB, 기기 내부에만 저장) ---------- */
let db = null, dbError = '';
const STORES = ['logs', 'journals', 'photos', 'trades', 'drawings', 'manuals', 'stars', 'specs', 'files', 'hbs'];
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB 미지원'));
    const r = indexedDB.open('site-log', 5);
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('annots')) d.createObjectStore('annots', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('hbtext')) d.createObjectStore('hbtext', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
const store = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
/* iPad Safari는 파일(File/Blob)을 저장소에 바로 넣으면 실패할 때가 있어 ArrayBuffer로 바꿔 저장한다 */
async function packBlobs(v) {
  if (v && v.blob instanceof Blob) { v = Object.assign({}, v); v.buf = await v.blob.arrayBuffer(); v.btype = v.blob.type || v.type || ''; delete v.blob; }
  if (v && Array.isArray(v.photos) && v.photos.some(p => p && p.blob instanceof Blob)) { v = Object.assign({}, v); v.photos = await Promise.all(v.photos.map(packBlobs)); }
  return v;
}
function unpackBlobs(v) {
  if (v && v.buf instanceof ArrayBuffer && !v.blob) v.blob = new Blob([v.buf], { type: v.btype || '' });
  if (v && Array.isArray(v.photos)) v.photos.forEach(unpackBlobs);
  return v;
}
const dbAll = async s => (await req(store(s).getAll())).map(unpackBlobs);
const dbGet = async (s, k) => unpackBlobs(await req(store(s).get(k)));
const dbPut = async (s, v) => { const pv = await packBlobs(v); return req(store(s, 'readwrite').put(pv)); };
const dbDel = (s, k) => req(store(s, 'readwrite').delete(k));

const cache = { logs: [], journals: [], trades: [], drawings: [], manuals: [], stars: [], specs: [], hbs: [] };
let hbChecked = 0;
async function reload() {
  const byDate = (a, b) => (b.date.localeCompare(a.date)) || ((b.updatedAt || 0) - (a.updatedAt || 0));
  const byCreated = (a, b) => (a.createdAt || 0) - (b.createdAt || 0);
  cache.logs = (await dbAll('logs')).sort(byDate);
  cache.journals = (await dbAll('journals')).sort(byDate);
  cache.trades = (await dbAll('trades')).sort(byCreated);
  cache.drawings = (await dbAll('drawings')).sort(byCreated);
  cache.manuals = (await dbAll('manuals')).sort(byCreated);
  cache.stars = (await dbAll('stars')).sort(byCreated);
  cache.specs = await dbAll('specs');
  cache.hbs = await dbAll('hbs');
}
const tradeName = id => { const t = cache.trades.find(x => x.id === id); return t ? t.name : '(삭제된 공종)'; };

/* ---------- 상태 ---------- */
const state = { tab: 'home', sub: 'input', q: '', tagFilter: '', onlyStar: false, mtab: 'trades', cut: '' };
let form = null, jform = null, mform = null, lastBackup = 0;
const TAGS = ['안전', '품질', '시공', '소통·보고', '서류·기록', '시간관리', '기타'];
const KINDS = ['시공전', '시공중', '시공후', '검측', '안전', '특이', '기타'];
const WEATHER = ['', '맑음', '흐림', '비', '눈', '기타'];

/* ---------- 공정률 계산 ---------- */
function calcProgress(cut) {
  const sums = {};
  for (const l of cache.logs) for (const r of (l.results || [])) {
    if (cut && l.date > cut) continue;
    const s = sums[r.tradeId] || (sums[r.tradeId] = { i: 0, s: 0, last: '' });
    s.i += num(r.inQty); s.s += num(r.setQty); if (l.date > s.last) s.last = l.date;
  }
  return cache.trades.map(t => {
    const s = sums[t.id] || { i: 0, s: 0, last: '' };
    const cin = num(t.prevIn) + s.i, cset = num(t.prevSet) + s.s, q = num(t.qty);
    const rin = q ? Math.min(1, cin / q) : 0, rset = q ? Math.min(1, cset / q) : 0;
    const wi = num(t.wIn), ws = num(t.wSet), wsum = wi + ws;
    const rate = wsum ? (rin * wi + rset * ws) / wsum : 0;
    return { t, cin, cset, rin, rset, rate, plan: num(t.plan) / 100, last: s.last };
  });
}
function overall(rows) {
  const w = rows.reduce((a, r) => a + num(r.t.wAll), 0);
  if (!w) return { w: 0, act: 0, plan: 0 };
  return { w, act: rows.reduce((a, r) => a + num(r.t.wAll) * r.rate, 0) / w, plan: rows.reduce((a, r) => a + num(r.t.wAll) * r.plan, 0) / w };
}

/* ---------- 사진 ---------- */
function shrink(file, max = 1280) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(new Error('변환 실패')); }, 'image/jpeg', 0.8);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지 오류')); };
    im.src = u;
  });
}

/* ---------- 일보 입력 ---------- */
async function startLog(id) {
  let log, photos = [];
  if (id) {
    log = await dbGet('logs', id);
    log.results = log.results || [];
    for (const pid of (log.photoIds || [])) {
      const ph = await dbGet('photos', pid);
      if (ph) photos.push({ id: ph.id, blob: ph.blob, caption: ph.caption || '', kind: ph.kind || '', url: URL.createObjectURL(ph.blob) });
    }
  } else {
    log = { id: uid(), date: today(), weather: '', crew: '', section: '', progress: '', results: cache.trades.length ? [{ tradeId: '', inQty: '', setQty: '' }] : [], drawing: '', drawingNote: '', special: '', photoIds: [] };
  }
  if (!id) {
    let d = null; try { d = db ? await dbGet('meta', 'draft') : null; } catch (e) { /* 무시 */ }
    if (d && d.log) {
      log = d.log;
      photos = (d.photos || []).map(p => ({ id: p.id, blob: p.blob, caption: p.caption || '', kind: p.kind || '', url: URL.createObjectURL(p.blob) }));
      toast('작성 중이던 일보를 복구했어요');
    }
  }
  form = { log, isNew: !id, photos, removed: [] };
  state.tab = 'log'; state.sub = 'input';
  render(); window.scrollTo(0, 0);
}
function collectLog() {
  if (!form) return;
  const l = form.log, g = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
  if (!$('#f-date')) return;
  l.date = $('#f-date').value || l.date;
  l.weather = g('f-weather'); l.crew = g('f-crew'); l.section = g('f-section');
  l.progress = g('f-progress'); l.drawingNote = g('f-dnote'); l.special = g('f-special');
  l.results = [...document.querySelectorAll('.rrow')].map(r => ({ tradeId: r.querySelector('.r-trade').value, inQty: r.querySelector('.r-in').value, setQty: r.querySelector('.r-set').value }));
  document.querySelectorAll('.ph').forEach((e, i) => { if (form.photos[i]) { form.photos[i].caption = e.querySelector('.cap').value; form.photos[i].kind = e.querySelector('.kind').value; } });
}
function photosHTML() {
  return form.photos.map((p, i) => `<div class="ph"><img src="${p.url}" alt=""><select class="kind"><option value="">구분 선택</option>${KINDS.map(k => `<option ${p.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select><input class="cap" type="text" placeholder="위치·내용 메모" value="${esc(p.caption)}"><button data-rm="${i}">삭제</button></div>`).join('');
}
function resRowsHTML() {
  const rows = form.log.results || [];
  if (!cache.trades.length) return '<small class="hint">공종마스터가 비어 있어요. 📚 자료 탭에서 공종을 먼저 등록하면 여기서 실적을 입력할 수 있어요.</small>';
  const opt = (t, sel) => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}${t.unit ? ' (' + esc(t.unit) + ')' : ''}</option>`;
  const opts = sel => {
    const groups = {};
    cache.trades.forEach(t => { const g = t.code ? t.code.split('_')[0] : ''; (groups[g] = groups[g] || []).push(t); });
    const keys = Object.keys(groups);
    if (keys.length === 1 && !keys[0]) return groups[''].map(t => opt(t, sel)).join('');
    return keys.map(g => `<optgroup label="${esc(g || '기타')}">${groups[g].map(t => opt(t, sel)).join('')}</optgroup>`).join('');
  };
  return '<div class="rhead"><span>공종</span><span>반입</span><span>설치</span><span></span></div>' + rows.map((r, i) => `<div class="rrow"><select class="r-trade"><option value="">공종 선택</option>${opts(r.tradeId)}</select><input class="r-in" type="number" inputmode="decimal" placeholder="0" value="${esc(r.inQty)}"><input class="r-set" type="number" inputmode="decimal" placeholder="0" value="${esc(r.setQty)}"><button type="button" data-rr="${i}">✕</button></div>`).join('') + '<button type="button" class="btn ghost sm" id="f-addres" style="margin-top:4px">＋ 공종 실적 추가</button>';
}
function logFormHTML() {
  const l = form.log;
  if (form.isNew && cache.trades.length && !(l.results || []).length) l.results = [{ tradeId: '', inQty: '', setQty: '' }];
  return `
  <h2>${form.isNew ? '오늘 작업일보' : '일보 수정'}</h2>
  <div class="card">
    <label>날짜</label><input id="f-date" type="date" value="${esc(l.date)}">
    <div class="row">
      <div><label>날씨</label><select id="f-weather">${WEATHER.map(w => `<option ${l.weather === w ? 'selected' : ''}>${w}</option>`).join('')}</select></div>
      <div><label>투입인원(명)</label><input id="f-crew" type="number" inputmode="numeric" value="${esc(l.crew)}"></div>
      <div><label>구간 / STA</label><input id="f-section" type="text" placeholder="예: 1+250~1+270" value="${esc(l.section)}"></div>
    </div>
    <label>작업내용</label><textarea id="f-progress" placeholder="예: 신호케이블 포설, 전철주 기초 타설">${esc(l.progress)}</textarea>
    <label>실적상세 (오늘 반입·설치 수량)</label>
    <div id="res">${resRowsHTML()}</div>
    <label>도면과 비교</label>
    <div class="seg">
      <button type="button" data-dw="ok" class="ok ${l.drawing === 'ok' ? 'on' : ''}">✔ 도면과 일치</button>

async function saveLog() {
  collectLog();
  const l = form.log;
  l.results = (l.results || []).filter(r => r.tradeId || r.inQty || r.setQty);
  if (l.results.some(r => !r.tradeId)) return toast('수량을 입력한 줄은 공종을 선택해 주세요');
  if (!l.progress && !l.special && !l.drawingNote && !l.results.length && !form.photos.length) return toast('내용을 입력해 주세요');
  try {
    l.photoIds = form.photos.map(p => p.id);
    for (const p of form.photos) await dbPut('photos', { id: p.id, blob: p.blob, caption: p.caption, kind: p.kind, logId: l.id });
    for (const rid of form.removed) await dbDel('photos', rid);
    l.updatedAt = Date.now(); l.createdAt = l.createdAt || l.updatedAt;
    await dbPut('logs', l); await reload();
    try { await dbDel('meta', 'draft'); } catch (e) { /* 무시 */ }
    toast('저장했어요 ✔'); startLog();
  } catch (e) { toast('저장 실패: ' + e.message); }
}
async function deleteLog() {

  for (const p of form.log.photoIds || []) await dbDel('photos', p);

}

/* ---------- 백업 · 내보내기 ---------- */
function dl(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' / ') + '"';
const csvBlob = rows => new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
const WORK_KEYS = ['logs', 'trades', 'drawings', 'manuals', 'hbs'], PERSONAL_KEYS = ['journals', 'stars', 'specs'];
async function exportJSON(kind = 'all') {
  toast('백업 파일 만드는 중…');
  const data = { app: 'site-log', version: 3, kind, exportedAt: new Date().toISOString() };
  if (kind !== 'personal') {
    WORK_KEYS.forEach(k => data[k] = cache[k]);
    data.photos = [];
    for (const p of await dbAll('photos')) data.photos.push({ id: p.id, logId: p.logId, caption: p.caption, kind: p.kind, data: await blobToDataURL(p.blob) });
    data.annots = await dbAll('annots');
    if (($('#d-incf') || {}).checked) { data.files = []; for (const f of await dbAll('files')) data.files.push({ id: f.id, name: f.name, type: f.type, size: f.size, data: await blobToDataURL(f.blob) }); }
  }
  if (kind !== 'work') {
    PERSONAL_KEYS.forEach(k => data[k] = cache[k]);
    data.meta = (await dbAll('meta')).filter(m => m.k === 'starTpl' || m.k.startsWith('review-'));
  }
  const label = { all: '전체', work: '업무', personal: '개인' }[kind];
  dl(`현장기록장_${label}백업_${today()}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
  const now = Date.now();
  if (kind !== 'personal') { lastBackup = now; await dbPut('meta', { k: 'lastBackup', v: now }); }
  if (kind !== 'work') await dbPut('meta', { k: 'lastPersonalBackup', v: now });
  render();
}
async function importJSON(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'site-log') throw new Error('이 앱의 백업 파일이 아니에요');
    for (const k of [...WORK_KEYS, ...PERSONAL_KEYS]) for (const v of d[k] || []) { if (k === 'hbs') v.indexed = false; await dbPut(k, v); }
    for (const p of d.photos || []) await dbPut('photos', { id: p.id, logId: p.logId, caption: p.caption, kind: p.kind, blob: await (await fetch(p.data)).blob() });
    for (const a of d.annots || []) await dbPut('annots', a);
    for (const f of d.files || []) await dbPut('files', { id: f.id, name: f.name, type: f.type, size: f.size, blob: await (await fetch(f.data)).blob() });
    for (const m of d.meta || []) { await dbPut('meta', m); if (m.k === 'starTpl') starTpl = m.v; }
    await reload(); toast('복원했어요 ✔'); render();
  } catch (e) { toast('복원 실패: ' + e.message); }
}
function exportLogCSV() {
  const rows = [['날짜', '날씨', '투입인원', '구간', '상세ID', '공종', '단위', '반입', '설치', '작업내용', '도면비교', '도면메모', '특이사항', '사진수']];
  for (const l of cache.logs.slice().reverse()) {
    const base = [l.date, l.weather, l.crew, l.section];
    const tail = [l.progress, l.drawing === 'ok' ? '일치' : l.drawing === 'diff' ? '차이있음' : '', l.drawingNote, l.special, (l.photoIds || []).length + (l.archived || 0)];
    if ((l.results || []).length) l.results.forEach(r => { const t = cache.trades.find(x => x.id === r.tradeId) || {}; rows.push([...base, t.code || '', tradeName(r.tradeId), t.unit || '', r.inQty, r.setQty, ...tail]); });
    else rows.push([...base, '', l.trade || '', '', '', '', ...tail]);
  }
  dl(`작업일보_${today()}.csv`, csvBlob(rows));

function exportSpecCSV() {
  const rows = [['순번', '기간', '무엇을(활동항목)', '그래서 결과는?(구체적 결과, 수치)', '노력+느낌/의미', '예시 역량']];

function exportStory() {
  const out = [];
  const groups = {}; cache.stars.forEach(s => (groups[s.comp || '분류 안 함'] = groups[s.comp || '분류 안 함'] || []).push(s));
  for (const c of [...COMPS, '분류 안 함']) {
    if (!groups[c]) continue;
    out.push(`■ ${c}\n`);
    groups[c].forEach(s => { out.push(starTpl.map(f => (s.v || {})[f.k] ? `${f.l}\n  ${(s.v || {})[f.k].replace(/\n/g, '\n  ')}` : '').filter(Boolean).join('\n') + '\n'); });

        collectLog();
        for (const f of e.target.files) {
          try { const b = await shrink(f); form.photos.push({ id: uid(), blob: b, caption: '', kind: '', url: URL.createObjectURL(b) }); }
          catch (err) { toast('사진 처리 실패'); }
        }
        e.target.value = ''; $('#photos').innerHTML = photosHTML(); bindPhotoRm(); saveDraft();
      }, 'change');
      bindPhotoRm(); bindRes();
    }
    if (state.sub === 'list') {
      on('q', e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 'input');
      document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => startLog(el.dataset.open));
    }
  }
  if (state.tab === 'prog') on('p-goto', () => { state.tab = 'ref'; state.mtab = 'trades'; render(); });
  if (state.tab === 'ref') {
    document.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { state.mtab = b.dataset.mt; mform = null; render(); });
    on('t-csv', e => { if (e.target.files[0]) importTradesCSV(e.target.files[0]); e.target.value = ''; }, 'change'); on('t-tpl', tradesTemplate);
    on('m-add', newMaster); on('m-save', saveMaster); on('m-cancel', () => { mform = null; render(); });
    on('m-del', async () => { if (!confirm('삭제할까요? 되돌릴 수 없어요.')) return; await dbDel(state.mtab, mform.rec.id); await reload(); mform = null; render(); toast('삭제했어요'); });
    document.querySelectorAll('[data-medit]').forEach(el => el.onclick = () => { mform = { isNew: false, rec: Object.assign({}, cache[state.mtab].find(x => x.id === el.dataset.medit)) }; render(); window.scrollTo(0, 0); });
  }
  if (state.tab === 'journal') bindJournal(on);
  if (state.tab === 'draw') bindDraw(on);
  if (state.tab === 'man') bindHb(on);
  if (state.tab === 'data') {
    on('d-json', () => exportJSON('all')); on('d-json-w', () => exportJSON('work')); on('d-json-p', () => exportJSON('personal')); on('pa-go', archivePhotos); on('sc-run', selfCheck); on('pa-m', () => render(), 'change'); on('d-csv1', exportLogCSV); on('d-csv2', exportJournalCSV); on('d-csv3', exportProgCSV); 
    on('d-import', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; }, 'change');
  }
}
function bindRes() {
  document.querySelectorAll('[data-rr]').forEach(b => b.onclick = () => { collectLog(); form.log.results.splice(+b.dataset.rr, 1); $('#res').innerHTML = resRowsHTML(); bindRes(); });
  const add = $('#f-addres'); if (add) add.onclick = () => { collectLog(); form.log.results.push({ tradeId: '', inQty: '', setQty: '' }); $('#res').innerHTML = resRowsHTML(); bindRes(); };
}
function bindPhotoRm() {
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    collectLog();
    const p = form.photos.splice(+b.dataset.rm, 1)[0];
    if (p && (form.log.photoIds || []).includes(p.id)) form.removed.push(p.id);
    $('#photos').innerHTML = photosHTML(); bindPhotoRm();
  });
}
const go = tab => {
  if (state.tab === 'log' && state.sub === 'input') collectLog();
  if (state.tab === 'journal') collectJournal();
  if (tab !== 'ref') mform = null;
  if (tab !== 'draw') dform = null;
  if (tab !== 'man') hbform = null;
  if (tab === 'journal' && state.tab !== 'journal') { state.ll = 'write'; sform = null; spform = null; tplDraft = null; }
  if (tab === 'ref') state.mtab = 'trades';
  if (tab === 'log' && state.tab !== 'log') state.sub = 'input';
  state.tab = tab; render(); window.scrollTo(0, 0);
};
$('#hd-home').onclick = () => go('home');

/* ---------- 시작 ---------- */
(async () => {
  try {
    db = await openDB();
    await reload();
    const m = await dbGet('meta', 'lastBackup'); lastBackup = m ? m.v : 0;
    const hc = await dbGet('meta', 'hbChecked'); hbChecked = hc ? hc.v : 0;
    const tp = await dbGet('meta', 'starTpl'); if (tp && Array.isArray(tp.v) && tp.v.length) starTpl = tp.v;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { dbError = e.message || '알 수 없는 오류'; db = null; }
  render();
})();
</script>
</body>
</html>
